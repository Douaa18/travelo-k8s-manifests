apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: travelo-mysql
  namespace: {{ .Values.namespace }}
spec:
  serviceName: travelo-mysql
  replicas: 1
  selector:
    matchLabels:
      app: travelo-mysql
  template:
    metadata:
      labels:
        app: travelo-mysql
    spec:
      containers:
        - name: mysql
          image: "{{ .Values.mysql.image }}:{{ .Values.mysql.tag }}"
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: travelo-secret
                  key: MYSQL_ROOT_PASSWORD
            - name: MYSQL_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: travelo-config
                  key: MYSQL_DATABASE
          ports:
            - containerPort: 3306
          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql
  volumeClaimTemplates:
    - metadata:
        name: mysql-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.mysql.storage }}
---
apiVersion: v1
kind: Service
metadata:
  name: travelo-mysql
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app: travelo-mysql
  ports:
    - port: 3306
      targetPort: 3306
  clusterIP: None