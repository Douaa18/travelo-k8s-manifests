apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: travelo-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Douaa18/travelo-k8s-manifests.git
    targetRevision: main
    path: .
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: travelo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true